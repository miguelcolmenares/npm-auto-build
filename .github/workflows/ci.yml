name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the checks only read the repository.
permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show shellcheck version
        run: shellcheck --version

      - name: Lint every tracked shell script
        run: git ls-files '*.sh' | xargs -r shellcheck

  workflows:
    name: workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Ruby and its YAML parser come with the runner image, so this job installs nothing:
      # no pip or gem command, and nothing that has to be pinned by hash.
      - name: Parse workflow and action YAML files
        run: |
          ruby -ryaml - <<'RUBY'
          paths = Dir[".github/workflows/*.yml"].sort
          paths += Dir["action.yml", "action.yaml"].sort
          paths << ".github/dependabot.yml"
          failed = false
          paths.each do |path|
            begin
              YAML.safe_load(File.read(path), aliases: true)
              puts "ok    #{path}"
            rescue StandardError => error
              failed = true
              puts "FAIL  #{path}: #{error.message}"
            end
          end
          exit(failed ? 1 : 0)
          RUBY

  # Bats is installed from the Ubuntu archive. That keeps one more third-party action
  # out of the supply chain, and the distribution pins the version. The tests only
  # need bats, PyYAML (python3-yaml, for tests/docs-examples.bats) and the Node.js that setup-node provides.
  bats:
    name: bats
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats python3-yaml

      - name: Show versions
        run: |
          bats --version
          node --version
          npm --version

      - name: Run the bats tests
        run: bats --print-output-on-failure tests/

  # Runs the action itself (`uses: ./`) against the fixture on the three systems.
  self-test:
    name: self-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the fixture with the action
        uses: ./
        with:
          mode: build
          working-directory: tests/fixture
          paths: dist

      - name: Check that the build output exists
        shell: bash
        run: |
          test -f tests/fixture/dist/out.txt
          cat tests/fixture/dist/out.txt

      - name: Run a mode that does not exist
        id: unknown
        uses: ./
        continue-on-error: true
        with:
          mode: deploy
          working-directory: tests/fixture

      - name: Check that the unknown mode failed
        shell: bash
        env:
          OUTCOME: ${{ steps.unknown.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "Expected an unknown mode to fail, the outcome was '$OUTCOME'." >&2
            exit 1
          fi

  # Runs mode commit end to end, with no write access to this repository. The job makes a
  # throwaway branch and points `origin` at a bare repository it creates itself, so the
  # push never leaves the runner. A file:// remote ignores the credential header, so the
  # bats tests cover how the header is built and passed.
  self-test-commit:
    name: self-test (commit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The full history, so the push to the local remote is not a shallow push.
          fetch-depth: 0
          persist-credentials: false

      - name: Create a local remote and a throwaway branch
        shell: bash
        run: |
          set -euo pipefail
          git init --quiet --bare --initial-branch=main "$RUNNER_TEMP/remote.git"
          git remote set-url origin "file://$RUNNER_TEMP/remote.git"
          git checkout --quiet -b self-test-commit
          git push --quiet origin self-test-commit
          echo "SEED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build and commit the fixture output
        id: first
        uses: ./
        with:
          mode: commit
          working-directory: tests/fixture
          paths: dist

      - name: Check that the commit reached the remote
        shell: bash
        env:
          CHANGED: ${{ steps.first.outputs.changed }}
          COMMIT_SHA: ${{ steps.first.outputs.commit-sha }}
        run: |
          set -euo pipefail
          remote="$RUNNER_TEMP/remote.git"
          if [ "$CHANGED" != "true" ]; then
            echo "Expected changed=true, got '$CHANGED'." >&2
            exit 1
          fi
          test -n "$COMMIT_SHA"
          test "$(git --git-dir="$remote" rev-parse self-test-commit)" = "$COMMIT_SHA"
          test "$(git --git-dir="$remote" rev-list --count "$SEED_SHA..self-test-commit")" = "1"
          git --git-dir="$remote" show self-test-commit:tests/fixture/dist/out.txt
          echo "$COMMIT_SHA" > "$RUNNER_TEMP/first-sha"

      - name: Run again, nothing changed
        id: second
        uses: ./
        with:
          mode: commit
          working-directory: tests/fixture
          paths: dist

      - name: Check that the second run made no commit
        shell: bash
        env:
          CHANGED: ${{ steps.second.outputs.changed }}
        run: |
          set -euo pipefail
          if [ "$CHANGED" != "false" ]; then
            echo "Expected changed=false, got '$CHANGED'." >&2
            exit 1
          fi
          test "$(git --git-dir="$RUNNER_TEMP/remote.git" rev-parse self-test-commit)" = "$(cat "$RUNNER_TEMP/first-sha")"

      - name: Detach HEAD, like a tag push
        shell: bash
        run: git checkout --quiet --detach

      - name: Run on a detached HEAD
        id: detached
        uses: ./
        continue-on-error: true
        with:
          mode: commit
          working-directory: tests/fixture
          paths: dist

      - name: Check that the detached HEAD failed
        shell: bash
        env:
          OUTCOME: ${{ steps.detached.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "Expected a detached HEAD to fail, the outcome was '$OUTCOME'." >&2
            exit 1
          fi

  # Runs mode pr end to end, with no write access to this repository and no GitHub API. The
  # job makes a throwaway branch, points `origin` at a bare repository it creates itself and
  # puts a stand-in `gh` first on PATH, so neither the push nor the pull request leaves the
  # runner. It proves the git side for real (the bot branch, the lease, the guards) and the
  # `gh` calls as a log. Opening a real pull request needs a repository to open it in, and the
  # bats tests cover how the token is passed.
  self-test-pr:
    name: self-test (pr)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The full history, so the push to the local remote is not a shallow push.
          fetch-depth: 0
          persist-credentials: false

      - name: Create a local remote, a throwaway branch and a stand-in for gh
        shell: bash
        run: |
          set -euo pipefail
          git init --quiet --bare --initial-branch=main "$RUNNER_TEMP/remote.git"
          git remote set-url origin "file://$RUNNER_TEMP/remote.git"
          git checkout --quiet -b self-test-pr
          git push --quiet origin self-test-pr
          echo "SEED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

          mkdir -p "$RUNNER_TEMP/fake-bin"
          cat > "$RUNNER_TEMP/fake-bin/gh" <<'GH'
          #!/usr/bin/env bash
          # Stand-in for gh: logs the call (never the token, only whether one was set) and
          # remembers the one pull request that `pr create` made.
          state="$RUNNER_TEMP/gh-state"
          mkdir -p "$state"
          printf 'CALL|%s|GH_TOKEN_SET=%s\n' "$*" "${GH_TOKEN:+yes}" >> "$RUNNER_TEMP/gh.log"
          case "$1 $2" in
            "pr list") [ ! -f "$state/pr" ] || cat "$state/pr" ;;
            "pr create")
              echo "1 https://github.com/example/repo/pull/1" > "$state/pr"
              echo "https://github.com/example/repo/pull/1"
              ;;
            "pr edit" | "pr merge") ;;
            "repo view") echo squash ;;
            *) echo "unexpected gh call: $*" >&2; exit 2 ;;
          esac
          GH
          chmod +x "$RUNNER_TEMP/fake-bin/gh"
          echo "$RUNNER_TEMP/fake-bin" >> "$GITHUB_PATH"

      - name: Build the fixture and open the pull request
        id: first
        uses: ./
        with:
          mode: pr
          working-directory: tests/fixture
          paths: dist

      - name: Check the bot branch and the pull request
        shell: bash
        env:
          PR_URL: ${{ steps.first.outputs.pull-request-url }}
          PR_NUMBER: ${{ steps.first.outputs.pull-request-number }}
        run: |
          set -euo pipefail
          remote="$RUNNER_TEMP/remote.git"
          test "$PR_URL" = "https://github.com/example/repo/pull/1"
          test "$PR_NUMBER" = "1"
          # The base branch did not move, the bot branch is one commit on top of it.
          test "$(git --git-dir="$remote" rev-parse self-test-pr)" = "$SEED_SHA"
          test "$(git --git-dir="$remote" rev-parse auto-build/self-test-pr^)" = "$SEED_SHA"
          test "$(git --git-dir="$remote" rev-list --count "$SEED_SHA..auto-build/self-test-pr")" = "1"
          git --git-dir="$remote" show auto-build/self-test-pr:tests/fixture/dist/out.txt
          git --git-dir="$remote" log -1 --format=%B auto-build/self-test-pr | grep -qxF "Generated-by: npm-auto-build"
          test "$(grep -c '^CALL|pr create ' "$RUNNER_TEMP/gh.log")" = "1"
          grep -q '^CALL|pr create .*--base=self-test-pr --head=auto-build/self-test-pr ' "$RUNNER_TEMP/gh.log"
          # The token reached gh as GH_TOKEN, in every call.
          test "$(grep -c 'GH_TOKEN_SET=yes$' "$RUNNER_TEMP/gh.log")" = "$(grep -c '^CALL|' "$RUNNER_TEMP/gh.log")"
          git --git-dir="$remote" rev-parse auto-build/self-test-pr > "$RUNNER_TEMP/bot-sha"

      - name: Run again with auto-merge, nothing changed
        id: second
        uses: ./
        with:
          mode: pr
          working-directory: tests/fixture
          paths: dist
          auto-merge: "true"

      - name: Check that the second run kept the one pull request
        shell: bash
        env:
          PR_NUMBER: ${{ steps.second.outputs.pull-request-number }}
        run: |
          set -euo pipefail
          remote="$RUNNER_TEMP/remote.git"
          test "$PR_NUMBER" = "1"
          # The same branch tip (no push), the same pull request (no second create).
          test "$(git --git-dir="$remote" rev-parse auto-build/self-test-pr)" = "$(cat "$RUNNER_TEMP/bot-sha")"
          test "$(grep -c '^CALL|pr create ' "$RUNNER_TEMP/gh.log")" = "1"
          test "$(grep -c '^CALL|pr edit 1 ' "$RUNNER_TEMP/gh.log")" = "1"
          grep -q '^CALL|pr merge 1 .*--auto --squash|' "$RUNNER_TEMP/gh.log"

      - name: Run with the base branch as the bot branch
        id: refused
        uses: ./
        continue-on-error: true
        with:
          mode: pr
          working-directory: tests/fixture
          paths: dist
          branch: self-test-pr

      - name: Check that the base branch was refused and not touched
        shell: bash
        env:
          OUTCOME: ${{ steps.refused.outcome }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != "failure" ]; then
            echo "Expected the base branch to be refused, the outcome was '$OUTCOME'." >&2
            exit 1
          fi
          test "$(git --git-dir="$RUNNER_TEMP/remote.git" rev-parse self-test-pr)" = "$SEED_SHA"

      - name: Run with a protected branch name
        id: protected
        uses: ./
        continue-on-error: true
        with:
          mode: pr
          working-directory: tests/fixture
          paths: dist
          branch: main

      - name: Check that the protected name was refused
        shell: bash
        env:
          OUTCOME: ${{ steps.protected.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "Expected the protected name to be refused, the outcome was '$OUTCOME'." >&2
            exit 1
          fi
          if git --git-dir="$RUNNER_TEMP/remote.git" rev-parse --verify --quiet refs/heads/main > /dev/null; then
            echo "The remote has a main branch, the run wrote to it." >&2
            exit 1
          fi

      - name: Detach HEAD, like a tag push
        shell: bash
        run: git checkout --quiet --detach

      - name: Run on a detached HEAD
        id: detached
        uses: ./
        continue-on-error: true
        with:
          mode: pr
          working-directory: tests/fixture
          paths: dist

      - name: Check that the detached HEAD failed
        shell: bash
        env:
          OUTCOME: ${{ steps.detached.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "Expected a detached HEAD to fail, the outcome was '$OUTCOME'." >&2
            exit 1
          fi

  # Mode check against the fixture, twice. First the build output is committed and fresh,
  # so the action must pass. Then the build changes and the output is not committed, so
  # the action must fail, report stale=true and upload the diff. The commit is local to
  # this job and is never pushed (the checkout keeps no credentials).
  self-test-check:
    name: self-test-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Commit a fresh build of the fixture
        run: |
          cd tests/fixture
          node build.js
          git add -f dist
          git -c user.name=ci -c user.email=ci@example.com commit -q -m "fixture build output"

      - name: Check a fresh build
        id: fresh
        uses: ./
        with:
          mode: check
          working-directory: tests/fixture
          paths: dist

      - name: Assert that the fresh build passed
        shell: bash
        env:
          OUTCOME: ${{ steps.fresh.outcome }}
          STALE: ${{ steps.fresh.outputs.stale }}
        run: |
          if [ "$OUTCOME" != "success" ] || [ "$STALE" != "false" ]; then
            echo "Expected success and stale=false, got outcome '$OUTCOME' and stale '$STALE'." >&2
            exit 1
          fi

      - name: Change the build output without committing it
        run: sed -i 's/built by the fixture/built by a new version/' tests/fixture/build.js

      - name: Check a stale build
        id: stale
        uses: ./
        continue-on-error: true
        with:
          mode: check
          working-directory: tests/fixture
          paths: dist

      - name: Assert that the stale build failed
        shell: bash
        env:
          OUTCOME: ${{ steps.stale.outcome }}
          STALE: ${{ steps.stale.outputs.stale }}
        run: |
          if [ "$OUTCOME" != "failure" ] || [ "$STALE" != "true" ]; then
            echo "Expected failure and stale=true, got outcome '$OUTCOME' and stale '$STALE'." >&2
            exit 1
          fi

      - name: Download the diff artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-auto-build-stale-diff
          path: ${{ runner.temp }}/stale-diff

      - name: Assert that the artifact holds the diff of the stale file
        shell: bash
        env:
          DIFF_DIR: ${{ runner.temp }}/stale-diff
        run: |
          grep -q '^+built by a new version$' "$DIFF_DIR/diff.patch"
          test "$(cat "$DIFF_DIR/files.txt")" = "tests/fixture/dist/out.txt"

  # One tiny real project per package manager. Each has a lockfile made by that manager
  # and a packageManager field, so the action sets the manager up with corepack.
  self-test-pm:
    name: self-test-pm (${{ matrix.fixture }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fixture: [pnpm, yarn-classic, yarn-berry]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the fixture with the action
        uses: ./
        with:
          mode: build
          working-directory: tests/fixtures/${{ matrix.fixture }}
          paths: dist

      # A yarn or pnpm that the runner image ships must not shadow the corepack shim without
      # anyone noticing: the manager that runs in the fixture has to be the pinned version.
      - name: Check that the manager is the version of the packageManager field
        shell: bash
        working-directory: tests/fixtures/${{ matrix.fixture }}
        run: |
          field=$(node -p "require('./package.json').packageManager")
          manager=${field%%@*}
          expected=${field#*@}
          expected=${expected%%+*}
          actual=$("$manager" --version)
          echo "$manager $actual (package.json asks for $expected)"
          test "$actual" = "$expected"

      - name: Check that the build output exists
        shell: bash
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: |
          test -f "tests/fixtures/$FIXTURE/dist/out.txt"
          cat "tests/fixtures/$FIXTURE/dist/out.txt"
          grep -q "built by the $FIXTURE fixture" "tests/fixtures/$FIXTURE/dist/out.txt"

  # The YAML examples of the README, the examples directory and the docs, checked against
  # action.yml. This is a structural check: each snippet must parse, use this action at @v3,
  # @main or a commit SHA, pass only inputs that exist with valid values, and have the
  # permissions and the checkout that its mode needs. It does not run the examples. The
  # self-test jobs above run the action itself, against the fixture projects.
  docs-examples:
    name: docs-examples
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # PyYAML comes from the Ubuntu archive, like bats in the bats job. No pip command, so
      # there is nothing to pin by hash.
      - name: Install PyYAML
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml

      - name: Check the README, its tables and its modes
        run: python3 tests/docs-examples.py --tables README.md --require-modes README.md

      - name: Check the examples and the other docs
        run: python3 tests/docs-examples.py examples/*.yml docs/recipes.md docs/migration-v2-to-v3.md docs/README.md .github/ACTION_DESCRIPTION.md
