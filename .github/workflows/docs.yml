name: Docs

on:
  push:
    # The default branch of the repository, written by `sitekit init` (`main` when it cannot be found).
    branches: [main]
    paths:
      [
        "site/**",
        "docs/**",
        "examples/**",
        "README.md",
        "CHANGELOG.md",
        "action.yml",
        ".github/workflows/docs.yml",
      ]
  pull_request:
    paths:
      [
        "site/**",
        "docs/**",
        "examples/**",
        "README.md",
        "CHANGELOG.md",
        "action.yml",
        ".github/workflows/docs.yml",
      ]
  # A release changes the changelog and the version the site shows, so the site is rebuilt for it.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The picture a shared link shows (site.image). It is drawn in the job, so no image is committed.
      - uses: miguelcolmenares/social-card-action@8927027164b0022e3ba12c0736ce575d547fe4ce # v0.1.0
        with:
          path: site/public/social.png
          name: "npm-auto-build"
          description: "Build your npm project and commit the build output, so you do not commit dist/ by hand."
          host: "miguelcolmenares.com/npm-auto-build"
      # Installs the site, builds it, checks it, and uploads the Pages artifact.
      # Pinned by commit SHA like every action of this repository (the tag is v0.3.0).
      - uses: miguelcolmenares/docs-sitekit@bf896fcbda7323bf1c4cce1376236b240c6e9054 # v0.3.0
        with:
          version: 0.3.0

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
