name: Dependency review

# Blocks a pull request that adds a dependency with a known high or critical
# vulnerability. This repository has a package-lock.json with no dependencies
# today, so the check passes trivially. It matters when dependencies appear,
# for example through a dependency update from Dependabot.
on:
  pull_request:

# Least privilege: the check only reads the dependency changes in the pull request.
permissions:
  contents: read

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
