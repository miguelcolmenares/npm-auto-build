name: "NPM Auto Build"
description: "Builds your npm project and commits the build output to your repository, so nobody commits dist/ by hand. The modes commit (default), check, pr and build are available in v3."

author: "Miguel Colmenares <me@miguelcolmenares.com>"

# v3 contract (issue #10). The modes commit, check, pr and build all work.
#
# Mode commit needs, in the workflow: `actions/checkout` with `persist-credentials: false`
# (so the build cannot read a token from .git/config) and `permissions: contents: write`.
# Mode pr needs the same, plus `permissions: pull-requests: write` and the repository setting
# "Allow GitHub Actions to create and approve pull requests" (or a PAT or App token as token).
inputs:
  mode:
    description: "What the action does: commit (default), check, pr or build. Commit builds and pushes the build output to the current branch. It needs a branch checkout (not a tag or a pull_request merge ref), actions/checkout with persist-credentials: false and permissions: contents: write. Check fails when the committed build output is stale and reads no token. Pr commits the build output to its own branch (the branch input), force-pushes only that bot-owned branch and keeps one pull request up to date against the checked out branch. It needs the same checkout, plus permissions: pull-requests: write and the setting Allow GitHub Actions to create and approve pull requests (or a personal access token or a GitHub App token as token)."
    required: false
    default: "commit"
  working-directory:
    description: "Directory that contains the package.json file. Relative to the workspace."
    required: false
    default: "."
  command:
    description: "Name of the package.json script that builds the project."
    required: false
    default: "build"
  install-command:
    description: "Command that installs the dependencies. Empty means the action picks the command for the package manager. When set, it replaces detection of the install command and ignore-scripts has no effect, the build still uses the detected package-manager."
    required: false
    default: ""
  package-manager:
    description: "Package manager: auto, npm, yarn or pnpm. Auto reads the packageManager field of package.json, then the lockfile (two lockfiles of different managers is an error, bun is not supported). An explicit value wins over both."
    required: false
    default: "auto"
  node-version:
    description: "Node.js version to install, for example 24 or 22.x. Ignored when node-version-file is set."
    required: false
    default: "24"
  node-version-file:
    description: "File with the Node.js version, for example .nvmrc or package.json. Relative to the workspace. When set, it wins over node-version."
    required: false
    default: ""
  registry-url:
    description: "Registry URL for actions/setup-node, for example https://npm.pkg.github.com. setup-node then writes an .npmrc that reads NODE_AUTH_TOKEN, set it in the env: of the job. Not a secret, so no credential in the URL."
    required: false
    default: ""
  scope:
    description: "Scope for the registry-url, for example @my-org. Only used together with registry-url."
    required: false
    default: ""
  paths:
    description: "Build output paths, one per line, relative to working-directory. Every path must exist after the build."
    required: false
    default: "dist"
  token:
    description: "GitHub token that pushes the build output and, in mode pr, opens the pull request (modes commit and pr, not read in build and check mode). Only the commit or pr step reads it, install and build never see it. The default GITHUB_TOKEN does not start new workflow runs, and a pull request opened with it does not start the checks either, so required checks need a personal access token or a GitHub App token. To push to a protected branch use a personal access token or a GitHub App token that may bypass the protection."
    required: false
    default: ${{ github.token }}
  commit-message:
    description: "Commit message for the build output (modes commit and pr). In mode commit keep [skip ci] in it: a push with a personal access token or a GitHub App token starts the workflow again, and without [skip ci] it can loop. In mode pr the default message is used without [skip ci], because GitHub skips the checks of a pull request whose head commit has it."
    required: false
    default: "chore: update build output [skip ci]"
  git-user-name:
    description: "Git user name for commits (modes commit and pr)."
    required: false
    default: "github-actions[bot]"
  git-user-email:
    description: "Git user email for commits (modes commit and pr)."
    required: false
    default: "github-actions[bot]@users.noreply.github.com"
  branch:
    description: "Branch that holds the build output in pr mode. Empty means auto-build/<checked out branch>. The action force-pushes this branch on every run, so it must be a branch that only the action writes to: it is refused when it is the base branch, the default branch of the remote, a reserved name (main, master, develop, release/* and similar), or a branch that already exists and was not made by this action."
    required: false
    default: ""
  pr-title:
    description: "Pull request title (mode pr). It is set again on every run."
    required: false
    default: "chore: update build output"
  pr-labels:
    description: "Pull request labels, comma separated (mode pr). The labels must exist in the repository. They are added on every run and never removed."
    required: false
    default: ""
  auto-merge:
    description: "Enable auto-merge on the pull request with gh pr merge --auto (mode pr). The repository needs Allow auto-merge and a branch protection rule with required checks. The merge method is the first one the repository allows: squash, merge or rebase."
    required: false
    default: "false"
  ignore-scripts:
    description: "Install dependencies without running lifecycle scripts: --ignore-scripts for npm, pnpm and yarn classic, YARN_ENABLE_SCRIPTS=false for yarn berry. No effect when install-command is set."
    required: false
    default: "false"
  upload-diff:
    description: "Upload the diff of a stale build as an artifact (mode check)."
    required: false
    default: "true"
  artifact-name:
    description: "Name of the artifact with the diff (mode check). Set a different name for each use of the action in one workflow run, a duplicate name makes the upload fail."
    required: false
    default: "npm-auto-build-stale-diff"

  # v2 names, accepted as aliases with no removal date, each with a warning that names the new input. The
  # value of github-token is read only by the commit and pr steps, where it wins over token.
  github-token:
    description: "Deprecated, use token. Accepted so a v2 workflow keeps working: a warning is printed and the value is used as the token of the commit and pr steps, where it wins over token."
    required: false
    default: ""
  directory:
    description: "Deprecated, use working-directory. Accepted as an alias."
    required: false
    default: ""
  build-dir:
    description: "Deprecated, use paths. Accepted as an alias."
    required: false
    default: ""
  build-only:
    description: "Deprecated, use mode: build. Accepted as an alias."
    required: false
    default: ""
  create-pr:
    description: "Deprecated, use mode: pr. Accepted as an alias."
    required: false
    default: ""

# `changed` and `commit-sha` come from the commit step, `stale` from the check step and the
# pull request outputs from the pr step. A step that is skipped leaves its outputs empty.
outputs:
  changed:
    description: "true when the action pushed a commit with new build output, false when nothing changed (mode commit). Empty in the other modes."
    value: ${{ steps.commit.outputs.changed }}
  stale:
    description: "true when the committed build output is out of date, false when it is fresh (mode check). Empty in the other modes."
    value: ${{ steps.check.outputs.stale }}
  commit-sha:
    description: "SHA of the pushed commit with the build output (mode commit). Empty when nothing changed and in build and check mode."
    value: ${{ steps.commit.outputs.commit-sha }}
  pull-request-url:
    description: "URL of the pull request (mode pr). Empty when nothing changed and in the other modes."
    value: ${{ steps.pr.outputs.pull-request-url }}
  pull-request-number:
    description: "Number of the pull request (mode pr). Empty when nothing changed and in the other modes."
    value: ${{ steps.pr.outputs.pull-request-number }}

runs:
  using: "composite"
  # Every input reaches a script through the env: of its own step. No step reads the
  # token, so the install and build steps cannot see it. There is no job level env.
  steps:
    - name: Validate inputs
      id: validate
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_INSTALL_COMMAND: ${{ inputs.install-command }}
        INPUT_PACKAGE_MANAGER: ${{ inputs.package-manager }}
        INPUT_NODE_VERSION: ${{ inputs.node-version }}
        INPUT_NODE_VERSION_FILE: ${{ inputs.node-version-file }}
        INPUT_REGISTRY_URL: ${{ inputs.registry-url }}
        INPUT_SCOPE: ${{ inputs.scope }}
        INPUT_PATHS: ${{ inputs.paths }}
        INPUT_COMMIT_MESSAGE: ${{ inputs.commit-message }}
        INPUT_GIT_USER_NAME: ${{ inputs.git-user-name }}
        INPUT_GIT_USER_EMAIL: ${{ inputs.git-user-email }}
        INPUT_BRANCH: ${{ inputs.branch }}
        INPUT_PR_TITLE: ${{ inputs.pr-title }}
        INPUT_PR_LABELS: ${{ inputs.pr-labels }}
        INPUT_AUTO_MERGE: ${{ inputs.auto-merge }}
        INPUT_IGNORE_SCRIPTS: ${{ inputs.ignore-scripts }}
        INPUT_UPLOAD_DIFF: ${{ inputs.upload-diff }}
        INPUT_DIRECTORY: ${{ inputs.directory }}
        INPUT_BUILD_DIR: ${{ inputs.build-dir }}
        INPUT_BUILD_ONLY: ${{ inputs.build-only }}
        INPUT_CREATE_PR: ${{ inputs.create-pr }}
        # Only a flag, never the value of the token.
        INPUT_GITHUB_TOKEN_SET: ${{ inputs.github-token != '' && 'true' || 'false' }}
      run: bash "$ACTION_PATH/scripts/validate-inputs.sh"

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ steps.validate.outputs.node-version }}
        node-version-file: ${{ inputs.node-version-file }}
        # Both are empty by default. With a registry-url, setup-node writes an .npmrc with a
        # ${NODE_AUTH_TOKEN} placeholder, never a token. The value comes from the job env:.
        registry-url: ${{ inputs.registry-url }}
        scope: ${{ inputs.scope }}
        # Caching stays off, it keeps the action simple.
        package-manager-cache: false

    - name: Install dependencies
      id: install
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: bash "$ACTION_PATH/scripts/install.sh"

    - name: Build
      id: build
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: bash "$ACTION_PATH/scripts/build.sh"

    # Mode check. Reads the build output and compares it with HEAD. It needs no token
    # and reads none, so it works on pull requests from forks.
    - name: Check the build output
      id: check
      if: steps.validate.outputs.mode == 'check'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: bash "$ACTION_PATH/scripts/check.sh"

    - name: Upload the diff
      if: always() && steps.validate.outputs.mode == 'check' && inputs.upload-diff == 'true' && steps.check.outputs.stale == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/nab-check
        if-no-files-found: ignore
        retention-days: 7

    # One of the two steps that get the token (the other is Pull request). It runs after the build, so the project's code
    # never runs with the token in its environment. The step `if:` reads the validate
    # output, because a composite step cannot test a value from GITHUB_ENV there.
    # Several jobs that push to the same branch need a `concurrency` group in the workflow.
    - name: Commit
      id: commit
      if: steps.validate.outputs.mode == 'commit'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        # The v2 name github-token wins over token, like a v2 workflow expects.
        NAB_TOKEN: ${{ inputs.github-token != '' && inputs.github-token || inputs.token }}
        NAB_COMMIT_MESSAGE: ${{ inputs.commit-message }}
        NAB_GIT_USER_NAME: ${{ inputs.git-user-name }}
        NAB_GIT_USER_EMAIL: ${{ inputs.git-user-email }}
      run: bash "$ACTION_PATH/scripts/commit.sh"

    # Mode pr. The other step that gets the token, and the only one besides Commit. It runs
    # after the build for the same reason. The script gives the token to git fetch, ls-remote
    # and push through GIT_CONFIG_*, and to gh as GH_TOKEN for one command, never through
    # this env: block. It needs permissions contents: write and pull-requests: write.
    - name: Pull request
      id: pr
      if: steps.validate.outputs.mode == 'pr'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        NAB_TOKEN: ${{ inputs.github-token != '' && inputs.github-token || inputs.token }}
        NAB_COMMIT_MESSAGE: ${{ inputs.commit-message }}
        NAB_GIT_USER_NAME: ${{ inputs.git-user-name }}
        NAB_GIT_USER_EMAIL: ${{ inputs.git-user-email }}
      run: bash "$ACTION_PATH/scripts/pr.sh"

branding:
  icon: "package"
  color: "blue"
