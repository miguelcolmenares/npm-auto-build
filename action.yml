name: "NPM Auto Build"
description: "Builds your npm project and commits the build output to your repository. Build and check are available in v3, commit and pr follow."

author: "Miguel Colmenares <me@miguelcolmenares.com>"

# v3 contract (issue #10). The modes build and check work for now. The modes commit
# and pr are implemented by issues #3 and #5 and fail at once with a clear error.
inputs:
  mode:
    description: "What the action does: commit (default), check, pr or build. Build and check are available, commit and pr are implemented by issues #3 and #5."
    required: false
    default: "commit"
  working-directory:
    description: "Directory that contains the package.json file. Relative to the workspace."
    required: false
    default: "."
  command:
    description: "Name of the package.json script that builds the project."
    required: false
    default: "build"
  install-command:
    description: "Command that installs the dependencies. Empty means detect it from the lockfile."
    required: false
    default: ""
  package-manager:
    description: "Package manager: auto, npm, yarn or pnpm. Auto detects it from the lockfile."
    required: false
    default: "auto"
  node-version:
    description: "Node.js version to install, for example 24 or 22.x. Ignored when node-version-file is set."
    required: false
    default: "24"
  node-version-file:
    description: "File with the Node.js version, for example .nvmrc or package.json. Relative to the workspace. When set, it wins over node-version."
    required: false
    default: ""
  paths:
    description: "Build output paths, one per line, relative to working-directory. Every path must exist after the build."
    required: false
    default: "dist"
  token:
    description: "GitHub token (modes commit and pr, not read in build and check mode). Only the commit step reads it, install and build never see it."
    required: false
    default: ${{ github.token }}
  commit-message:
    description: "Commit message for the build output (modes commit and pr)."
    required: false
    default: "chore: update build output [skip ci]"
  git-user-name:
    description: "Git user name for commits (modes commit and pr)."
    required: false
    default: "github-actions[bot]"
  git-user-email:
    description: "Git user email for commits (modes commit and pr)."
    required: false
    default: "github-actions[bot]@users.noreply.github.com"
  branch:
    description: "Branch that holds the build output in pr mode. Empty means auto-build/<ref>."
    required: false
    default: ""
  pr-title:
    description: "Pull request title (mode pr)."
    required: false
    default: ""
  pr-labels:
    description: "Pull request labels, comma separated (mode pr)."
    required: false
    default: ""
  auto-merge:
    description: "Enable auto-merge on the pull request (mode pr)."
    required: false
    default: "false"
  ignore-scripts:
    description: "Install dependencies with --ignore-scripts, so no lifecycle script runs."
    required: false
    default: "false"
  upload-diff:
    description: "Upload the diff of a stale build as an artifact (mode check)."
    required: false
    default: "true"
  artifact-name:
    description: "Name of the artifact with the diff (mode check). Set a different name for each use of the action in one workflow run, a duplicate name makes the upload fail."
    required: false
    default: "npm-auto-build-stale-diff"

  # v2 names, accepted for a short time, each with a warning that names the new input. The
  # value of github-token is NOT read yet, the commit step of issue #3 decides what to do with it.
  github-token:
    description: "Deprecated, use token. Accepted so a v2 workflow does not fail, but only a warning is printed and the value is not read yet."
    required: false
    default: ""
  directory:
    description: "Deprecated, use working-directory. Accepted as an alias."
    required: false
    default: ""
  build-dir:
    description: "Deprecated, use paths. Accepted as an alias."
    required: false
    default: ""
  build-only:
    description: "Deprecated, use mode: build. Accepted as an alias."
    required: false
    default: ""
  create-pr:
    description: "Deprecated, use mode: pr. Accepted as an alias."
    required: false
    default: ""

# Declared now so later issues only add behavior. Build mode builds and commits
# nothing, so it has nothing honest to report and leaves them empty.
outputs:
  changed:
    description: "true when the build output differs from the repository. Empty in build and check mode."
    value: ${{ steps.build.outputs.changed }}
  stale:
    description: "true when the committed build output is out of date, false when it is fresh (mode check). Empty in the other modes."
    value: ${{ steps.check.outputs.stale }}
  commit-sha:
    description: "SHA of the commit with the build output. Empty in build and check mode."
    value: ${{ steps.build.outputs.commit-sha }}
  pull-request-url:
    description: "URL of the pull request (mode pr). Empty in build and check mode."
    value: ${{ steps.build.outputs.pull-request-url }}
  pull-request-number:
    description: "Number of the pull request (mode pr). Empty in build and check mode."
    value: ${{ steps.build.outputs.pull-request-number }}

runs:
  using: "composite"
  # Every input reaches a script through the env: of its own step. No step reads the
  # token, so the install and build steps cannot see it. There is no job level env.
  steps:
    - name: Validate inputs
      id: validate
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_INSTALL_COMMAND: ${{ inputs.install-command }}
        INPUT_PACKAGE_MANAGER: ${{ inputs.package-manager }}
        INPUT_NODE_VERSION: ${{ inputs.node-version }}
        INPUT_NODE_VERSION_FILE: ${{ inputs.node-version-file }}
        INPUT_PATHS: ${{ inputs.paths }}
        INPUT_COMMIT_MESSAGE: ${{ inputs.commit-message }}
        INPUT_GIT_USER_NAME: ${{ inputs.git-user-name }}
        INPUT_GIT_USER_EMAIL: ${{ inputs.git-user-email }}
        INPUT_BRANCH: ${{ inputs.branch }}
        INPUT_PR_TITLE: ${{ inputs.pr-title }}
        INPUT_PR_LABELS: ${{ inputs.pr-labels }}
        INPUT_AUTO_MERGE: ${{ inputs.auto-merge }}
        INPUT_IGNORE_SCRIPTS: ${{ inputs.ignore-scripts }}
        INPUT_UPLOAD_DIFF: ${{ inputs.upload-diff }}
        INPUT_DIRECTORY: ${{ inputs.directory }}
        INPUT_BUILD_DIR: ${{ inputs.build-dir }}
        INPUT_BUILD_ONLY: ${{ inputs.build-only }}
        INPUT_CREATE_PR: ${{ inputs.create-pr }}
        # Only a flag, never the value of the token.
        INPUT_GITHUB_TOKEN_SET: ${{ inputs.github-token != '' && 'true' || 'false' }}
      run: bash "$ACTION_PATH/scripts/validate-inputs.sh"

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ steps.validate.outputs.node-version }}
        node-version-file: ${{ inputs.node-version-file }}
        # Caching stays off, it keeps the action simple.
        package-manager-cache: false

    - name: Install dependencies
      id: install
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: bash "$ACTION_PATH/scripts/install.sh"

    - name: Build
      id: build
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: bash "$ACTION_PATH/scripts/build.sh"

    # Mode check. Reads the build output and compares it with HEAD. It needs no token
    # and reads none, so it works on pull requests from forks.
    - name: Check the build output
      id: check
      if: steps.validate.outputs.mode == 'check'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: bash "$ACTION_PATH/scripts/check.sh"

    - name: Upload the diff
      if: always() && steps.validate.outputs.mode == 'check' && inputs.upload-diff == 'true' && steps.check.outputs.stale == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/nab-check
        if-no-files-found: ignore
        retention-days: 7

branding:
  icon: "package"
  color: "blue"
